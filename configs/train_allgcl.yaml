defaults:
  - data: allgcl
  - model: nuclr_v2ga_ca2
  - loss: sw_dcl
  - optim: adamw
  - trainer: contrastive
  - train_transform: calcium_training_views
  - _self_

data_root: ${data.data_root}
output_dir: ./output
resume: auto
device: auto
target_steps: 50000
max_steps: null

views:
  duration: ${data.ctx_duration}  # in seconds
  max_distance: ${data.pairing.max_distance}  # in seconds

seed: 42
num_workers: 7  # scaled with num_gpus

precision: bf16
num_epochs: null
batch_size: 16  # total value (across all GPUs)

val:
  first: false  # do val before train (for debug)
  every_n_epochs: 1
  loss: true  # compute val loss

lr:
  rise: 1  # num of epochs to rise for (could be float to indicate ratio of epochs)
  decay: 1 # epoch num at which to start decaying (could be float to indicate ratio of epochs)
  max: 0.000125

grad_clip:
  enable: true
  max_norm: 1.0

ckpt:
  enable: true
  dir: ${output_dir}/ckpt/
  every_n_epochs: 1
  load_from: null
  resume: false
  model_only: false

wandb:
  mode: offline  # options: online / offline / disabled
  entity: null
  project: nuGCL
  name: null
  dir: ${output_dir}/wandb
  resume: allow
  id: null  # set to wandb id if resuming

ddp:
  force: false
  master_addr: localhost
  master_port: null

debug: null  # options: "train", "tokenizer"

log_weights: false
log_grads: false


model:
  sampling_rate: 7.8125
  patch_size: 8
  drop_nonfinite_units: true

optim:
  lr: ${lr.max}

loss:
  scale_same_view: true

# Opt-in only; a missing/disabled block follows the d0b2c03 training path.
debias:
  enabled: false
  track_normalizer: false
  normalizer_mode: ema
  normalizer_momentum: 0.01
  target: split_group
  pilot: false
  ledger_file: null
  normalizer_file: null
  lambda_max: 0.0
  normalization_fit_steps: 125
  head_warmup_steps: 125
  encoder_ramp_steps: 1250
  head_optimizer:
    lr: 0.0001
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8
  head_lr_schedule: constant
  head_clip_norm: 1.0

hydra:
  run:
    dir: ${output_dir}/hydra
  job:
    chdir: false
